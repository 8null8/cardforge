<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Forge</title>
<style>
@page { size: __PAGESIZE__; margin: 0; }
:root {
  --ink: #1f1a14;
  --paper: #f8f1e0;
  --gold: #e3c378;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", "P052", "TeX Gyre Pagella", Georgia, "DejaVu Serif", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: #5d5d62; font-family: var(--serif); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* ---------- toolbar (screen only) ---------- */
.bar { position: sticky; top: 0; z-index: 5; background: #24232a; color: #eee; font: 14px/1.4 system-ui, sans-serif;
  padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.bar b { color: #fff; }
.bar button { font: inherit; background: #e3c378; color: #222; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
.bar .tip { opacity: .8; font-size: 12.5px; }
.bar .warn { color: #ffb4a0; }

/* ---------- sheets ---------- */
.sheet { position: relative; background: #fff; margin: 18px auto; box-shadow: 0 4px 18px rgba(0,0,0,.35); overflow: hidden;
  break-after: page; page-break-after: always; }
/* the inner layer is always the full page (the sheet itself is a hair shorter so no blank pages appear),
   so a 180° turn for short-edge flipping pivots on the page's true centre */
.sheet .inner { position: absolute; left: 0; top: 0; width: 100%; }
.sheet .label { position: absolute; left: .25in; top: .08in; font: 8pt system-ui, sans-serif; color: #999; }
.cell { position: absolute; }
.cell > .panel, .cell > .fold { outline: .5pt solid #c9c9c9; }
.cut { position: absolute; background: #8a8a8a; z-index: 3; pointer-events: none; }
body.nogap .cell > .panel, body.nogap .cell > .fold, body.nogap .cell > .idxcard > .panel { outline: none; }
body.nogap .panel, body.nogap .fold .panel { border-radius: 0; }
.fold { position: absolute; left: 0; top: 0; width: 5in; height: 3.5in; display: flex; }
/* fold line: a light dashed seam between the two halves */
.fold.outside::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: .6pt dashed rgba(0,0,0,.35); z-index: 2; }

@media print {
  body { background: none; }
  .bar { display: none; }
  .sheet { margin: 0; box-shadow: none; }
  .sheet .label { display: none; }
}
#sheets .sheet:last-child { break-after: auto; page-break-after: auto; }
#measure { position: absolute; left: -30in; top: 0; visibility: hidden; }

/* ---------- card panel ---------- */
.panel { --c: #444; width: 2.5in; height: 3.5in; position: relative; background: var(--paper); color: var(--ink);
  border-radius: .13in; overflow: hidden; font-family: var(--serif); line-height: 1.18; }
.fold .panel.fl { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.fold .panel.fr { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.panel .frame { position: absolute; inset: .075in; border: 1.4pt solid var(--c); border-radius: .09in;
  display: flex; flex-direction: column; padding: 0 .065in .03in; background:
  radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.55), transparent 65%); }
.fold .panel.fl .frame { right: .035in; border-top-right-radius: .02in; border-bottom-right-radius: .02in; }
.fold .panel.fr .frame { left: .035in; border-top-left-radius: .02in; border-bottom-left-radius: .02in; }

.ttl { background: var(--c); color: #fff; margin: 0 -.065in; padding: .035in .065in .03in; display: flex; align-items: center;
  gap: .05in; border-radius: .06in .06in 0 0; }
.ttl .name { flex: 1; font-size: 1.5em; font-weight: 700; font-variant: small-caps; letter-spacing: .02em; line-height: 1.02; }
.ttl.small .name { font-size: 1.15em; }
.ttl .name em { font-style: normal; font-weight: 400; opacity: .8; font-size: .8em; }
.ttl .badge { flex: none; min-width: 1.9em; height: 1.9em; border-radius: 50%; background: #fff; color: var(--c); font-weight: 700;
  display: flex; align-items: center; justify-content: center; font-size: 1em; padding: 0 .2em; box-shadow: 0 0 0 1.2pt var(--gold) inset; }
.sub { font-style: italic; font-size: .95em; padding: .2em 0 .25em; border-bottom: .8pt solid var(--c); margin-bottom: .3em; }
.hdr { margin-bottom: .3em; }
.hdr:empty { display: none; }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .18em .3em; }
.sgrid > div { background: rgba(0,0,0,.045); border-radius: 2pt; padding: .15em .3em; font-size: .92em; }
.lbl { display: block; font-size: .78em; text-transform: uppercase; letter-spacing: .06em; color: var(--c); font-weight: 700; }
.mat { font-size: .82em; font-style: italic; margin-top: .25em; }
.scrollinfo { font-size: .86em; margin-bottom: .3em; padding: .12em .35em; border: .8pt dashed var(--c); border-radius: 2pt;
  background: rgba(122, 74, 28, .08); text-align: center; }
.cls { font-size: .78em; margin-top: .2em; color: #555; }
.mline { font-size: .95em; }
.mline b { color: var(--c); }
/* creature stat blocks: every stat, trait and action sits in its own outlined, lightly shaded box */
.mgrid { display: flex; flex-wrap: wrap; gap: .2em; margin-bottom: .2em; }
.mgrid > div, .abil > div, .body .mbox { border: .6pt solid rgba(122, 31, 31, .5); border-color: color-mix(in srgb, var(--c) 50%, transparent);
  background: rgba(0, 0, 0, .055); border-radius: 2.5pt; }
.mgrid > div { flex: 1 1 auto; padding: .1em .35em; font-size: .95em; }
.mgrid b { color: var(--c); }
.abil { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .2em; text-align: center; margin: 0 0 .1em; font-size: .86em; }
.abil > div { padding: .06em 0 .1em; overflow-wrap: anywhere; }
.abil .lbl { font-size: .85em; }
.body .mbox { padding: .14em .35em; margin: 0 0 .25em; }
.body .mbox > :last-child { margin-bottom: 0; }
.body .mbox p { margin-bottom: .16em; }
.body .mbox.mstat { text-align: left; padding: .08em .35em; margin-bottom: .2em; }
.body .mbox.mstat b { color: var(--c); }
.body .mbox.head { border-bottom-style: dashed; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.body .mbox.cont { border-top-style: dashed; border-top-left-radius: 0; border-top-right-radius: 0; }
.body h4.sec + .mbox, .body h4.sec + p { margin-top: .3em; }

.body { flex: 1 1 auto; min-height: 0; overflow: hidden; }
.body p { margin: 0 0 .28em; text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
.body p.cont { text-indent: 0; }
.body p.li { padding-left: .9em; text-indent: -.7em; margin-bottom: .18em; }
.body p.li::before { content: "\2022\00a0"; color: var(--c); }
.body p.li.cont::before { content: ""; }
.body p.li.cont { text-indent: 0; }
.body p.ind { padding-left: .8em; margin-bottom: .15em; }
.body p.inset, .body h4.inset { background: rgba(0,0,0,.05); padding: .15em .35em; margin-bottom: 0; }
.body p.quote { font-size: .95em; }
.body p.r { text-align: right; }
.body p.c { text-align: center; }
.body p.small { font-size: .85em; }
.body p.stat { margin-bottom: .1em; text-align: left; }
.body p.stat b { color: var(--c); }
.body h4 { margin: .25em 0 .2em; font-size: 1.08em; font-variant: small-caps; color: var(--c); border-bottom: .6pt solid var(--c); }
.body h4.sec { font-size: 1.15em; }
.body hr { border: 0; border-top: .8pt solid var(--c); margin: .3em 0; }
.body table { width: 100%; border-collapse: collapse; margin: .15em 0 .35em; font-size: .9em; }
.body caption { font-weight: 700; text-align: left; padding-bottom: .1em; }
.body th { text-align: left; border-bottom: .8pt solid var(--c); padding: .05em .2em; color: var(--c); }
.body td { padding: .05em .2em; vertical-align: top; }
.body td.c { text-align: center; }
/* list cards: compact table, short columns kept on one line */
.body table.lst { margin-top: 0; }
.body table.lst th, .body table.lst td { padding: .03em .18em; }
.body table.lst td:first-child { font-weight: 600; }
.body table.lst .nw { white-space: nowrap; }
.body tbody tr:nth-child(odd) td { background: rgba(0,0,0,.05); }

.foot { display: flex; justify-content: space-between; font-size: .72em; color: #7a7266; padding-top: .15em; border-top: .5pt solid rgba(0,0,0,.15); }
.panel.clipped .foot::after { content: " \2702"; }

/* index cards (landscape) */
.panel.idx35 { width: 5in; height: 3in; border-radius: .1in; }
.panel.idx58 { width: 8in; height: 5in; border-radius: .12in; }
.panel.idx .body { display: flex; gap: .16in; }
.panel.idx .body > .col { flex: 1 1 0; min-width: 0; height: 100%; overflow: hidden; }
.panel.idx .body > .col + .col { border-left: .5pt solid rgba(0,0,0,.12); padding-left: .16in; margin-left: -.08in; }
.panel.idx .sgrid { grid-template-columns: repeat(4, 1fr); }
.panel.idx .hdr .mline { display: inline-block; margin-right: 1.2em; }
.panel.idx .mgrid > div { flex: 0 1 auto; }
.panel.idx .abil { max-width: 4.2in; }
/* absolute-unit transforms only: percentage transforms break Chrome's print layout */
.idxcard { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.idxcard.cw  { transform: translateX(3in) rotate(90deg); }
.idxcard.ccw { transform: translateY(5in) rotate(-90deg); }
.cell > .idxcard > .panel { outline: .5pt solid #c9c9c9; }
@page s35 { size: 5in 3in; margin: 0; }
@page s58 { size: 8in 5in; margin: 0; }
.sheet.s35 { page: s35; }
.sheet.s58 { page: s58; }

/* decorative back */
.panel.back { background: none; }
.panel.back svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <b>Card Forge</b><span id="summary"></span>
  <button onclick="window.print()">Print</button>
  <span class="tip">Print at 100% scale · Margins: None · Background graphics: on · Two-sided, flip on the <span id="flipedge"></span> edge.
  Cut along the grey lines (they run to the paper edge); fold the double-wide cards on the dashed line.<span id="onlynote"></span></span>
</div>
<div id="sheets"></div>
<div id="measure"></div>
<script>
const DATA = /*__DATA__*/null;
(function () {
  const cfg = DATA.cfg;
  const PAPER = cfg.paper === "a4" ? { w: 210 / 25.4, h: 297 / 25.4 } : { w: 8.5, h: 11 };
  // printer correction for the back side, in mm as seen looking at the back (+x right, +y down); see --calibrate
  const BACK_OFFSET = Array.isArray(cfg.backOffset) ? cfg.backOffset.map(Number) : [0, 0];
  const GAP = cfg.gap;
  const measure = document.getElementById("measure");
  if (GAP <= 0) document.body.classList.add("nogap");
  const sheetsEl = document.getElementById("sheets");
  document.getElementById("flipedge").textContent = cfg.duplex;

  const ICONS = {
    star: "M12 1.5 L14.2 9.8 L22.5 12 L14.2 14.2 L12 22.5 L9.8 14.2 L1.5 12 L9.8 9.8 Z",
    skull: "M12 2C7 2 3.8 5.6 3.8 10.2c0 3 1.4 5 3.2 6.2V19.5h2.2V21.5h5.6v-2h2.2v-3.1c1.8-1.2 3.2-3.2 3.2-6.2C20.2 5.6 17 2 12 2Z M8.6 8.4a2.2 2.2 0 1 0 .01 0Z M15.4 8.4a2.2 2.2 0 1 0 .01 0Z M12 13.2l-1.4 2.6h2.8Z",
    sword: "M20.5 2.5 L21.5 3.5 L21 6.5 L11 16.5 L7.5 13 L17.5 3 Z M6.3 13.2 L10.8 17.7 L9.4 19.1 L8.2 17.9 L4.6 21.5 L2.5 19.4 L6.1 15.8 L4.9 14.6 Z",
    shield: "M12 1.8 L20.5 4.8 V11 C20.5 16.4 16.8 20.3 12 22.2 C7.2 20.3 3.5 16.4 3.5 11 V4.8 Z M12 5 V19 C15.4 17.4 17.6 14.6 17.6 11 V6.9 Z",
    potion: "M9 1.8 H15 V3.8 H14 V8.3 C17.3 9.4 19.5 12.2 19.5 15.4 A7.5 7.5 0 0 1 4.5 15.4 C4.5 12.2 6.7 9.4 10 8.3 V3.8 H9 Z M6.6 15 H17.4 A5.4 5.4 0 0 1 6.6 15 Z",
    ring: "M12 7.5 a7.25 7.25 0 1 0 .01 0Z M12 10.2 a4.55 4.55 0 1 1 -.01 0Z M8.6 2 H15.4 L13.6 6.4 H10.4 Z",
    scroll: "M6 3.5 H17.5 A2.5 2.5 0 0 1 17.5 8.5 H17 V18 A2.5 2.5 0 0 1 14.5 20.5 H5 A2.5 2.5 0 0 1 5 15.5 H6 Z M8.5 8 H14.5 V9.3 H8.5 Z M8.5 11 H14.5 V12.3 H8.5 Z M8.5 14 H13 V15.3 H8.5 Z",
    wand: "M3 19.6 L15.4 7.2 L16.8 8.6 L4.4 21 Z M18.5 1.5 L19.4 4.6 L22.5 5.5 L19.4 6.4 L18.5 9.5 L17.6 6.4 L14.5 5.5 L17.6 4.6 Z",
    gem: "M6 3 H18 L22.5 9 L12 21.5 L1.5 9 Z M7.3 4.6 L4.5 8.6 H8.6 Z M16.7 4.6 L15.4 8.6 H19.5 Z M10.2 4.6 L9.5 8.6 H14.5 L13.8 4.6 Z",
    chest: "M2.5 10 H21.5 V20.5 H2.5 Z M2.5 8.8 C2.5 5 5.8 3.5 12 3.5 C18.2 3.5 21.5 5 21.5 8.8 Z M10.4 9 H13.6 V13.4 H10.4 Z",
    medal: "M7 1.5 H10.5 L12 6 L13.5 1.5 H17 L14.3 8.4 A7 7 0 1 1 9.7 8.4 Z M12 11 L13.3 13.7 L16.2 14 L14 16 L14.6 18.9 L12 17.4 L9.4 18.9 L10 16 L7.8 14 L10.7 13.7 Z",
    person: "M12 2.5 a4 4 0 1 0 .01 0Z M4 21.5 C4 15.5 7.5 12.5 12 12.5 C16.5 12.5 20 15.5 20 21.5 Z",
    flame: "M12 1.5 C14 6 18.5 8.5 18.5 14 A6.5 6.5 0 0 1 5.5 14 C5.5 10.6 7.6 9.2 8.8 6.2 C10 8.6 11.2 8.8 12 1.5 Z M12 13 C13 15 14.5 15.6 14.5 17.6 A2.5 2.5 0 0 1 9.5 17.6 C9.5 16 11 15 12 13Z",
    sun: "M12 6.5 a5.5 5.5 0 1 0 .01 0Z M11 0.5 H13 V4.5 H11Z M11 19.5 H13 V23.5 H11Z M0.5 11 H4.5 V13 H0.5Z M19.5 11 H23.5 V13 H19.5Z M3.2 4.6 L4.6 3.2 L7.4 6 L6 7.4Z M16.6 18 L18 16.6 L20.8 19.4 L19.4 20.8Z M3.2 19.4 L6 16.6 L7.4 18 L4.6 20.8Z M16.6 6 L19.4 3.2 L20.8 4.6 L18 7.4Z",
    book: "M3 4 H10.5 C11.3 4 12 4.6 12 5.4 C12 4.6 12.7 4 13.5 4 H21 V19.5 H13.5 C12.7 19.5 12 20.1 12 21 C12 20.1 11.3 19.5 10.5 19.5 H3 Z M12 6.5 V18.5",
    eye: "M12 5 C6.5 5 2.8 9 1.5 12 C2.8 15 6.5 19 12 19 C17.5 19 21.2 15 22.5 12 C21.2 9 17.5 5 12 5 Z M12 8.2 a3.8 3.8 0 1 0 .01 0Z"
  };

  const SERIF = "Palatino Linotype, Book Antiqua, Palatino, P052, URW Palladio L, Georgia, DejaVu Serif, serif";
  function shade(hex, f) { // f<0 darker, f>0 lighter
    const n = parseInt(hex.replace("#", ""), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = f < 0 ? 0 : 255, p = Math.abs(f);
    r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  const escx = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  function node(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function div(cls) { const d = document.createElement("div"); if (cls) d.className = cls; return d; }

  // ---------------------------------------------------------------- panels
  function makePanel(card, idx, fs, size) {
    const p = div("panel cat-" + card.cat + (size && size !== "card" ? " idx idx" + size.replace("x", "") : ""));
    p.style.setProperty("--c", card.color);
    p.style.fontSize = fs + "pt";
    const f = div("frame"); p.append(f);
    if (idx === 0) {
      const badge = card.corner ? `<span class="badge">${escx(card.corner)}</span>` : "";
      f.append(node(`<div class="ttl"><span class="name">${escx(card.name)}</span>${badge}</div>`));
      f.append(node(`<div class="sub">${card.sub}</div>`));
      const h = div("hdr"); h.innerHTML = card.hdr || ""; f.append(h);
    } else {
      f.append(node(`<div class="ttl small"><span class="name">${escx(card.name)} <em>(cont.)</em></span></div>`));
    }
    const body = div("body"); f.append(body);
    if (size && size !== "card") for (let k = 0; k < (size === "5x8" ? 3 : 2); k++) body.append(div("col"));
    f.append(node(`<div class="foot"><span>${escx(card.src || "")}</span><span class="pg"></span></div>`));
    return p;
  }

  function makeBack(card) {
    const b = card.back, c = b.color || card.color, dk = shade(c, -0.45), lt = shade(c, 0.15), gold = "#e3c378";
    const id = "g" + Math.random().toString(36).slice(2, 8);
    let ticks = "";
    for (let i = 0; i < 48; i++) {
      const a = i * Math.PI / 24, r1 = i % 4 ? 63 : 59, r2 = 68;
      ticks += `<line x1="${125 + r1 * Math.cos(a)}" y1="${178 + r1 * Math.sin(a)}" x2="${125 + r2 * Math.cos(a)}" y2="${178 + r2 * Math.sin(a)}"/>`;
    }
    const corner = (x, y, sx, sy) => `<g transform="translate(${x} ${y}) scale(${sx} ${sy})"><path d="M0 26 Q0 0 26 0" fill="none"/><path d="M6 6 L12 0 L18 6 L12 12Z" fill="${gold}" stroke="none" transform="translate(-3 -3) scale(.7)"/><circle cx="6" cy="6" r="2.2" fill="${gold}" stroke="none"/></g>`;
    const icon = ICONS[b.icon] || ICONS.star;
    let center;
    if (b.big) {
      const fsz = b.big.length <= 1 ? 62 : b.big.length <= 2 ? 52 : 40;
      center = `<g fill="${gold}" transform="translate(114.8 124) scale(.85)"><path d="${icon}" fill-rule="evenodd"/></g>
        <text x="125" y="${200 - (62 - fsz) / 4}" text-anchor="middle" font-size="${fsz}" font-weight="700" fill="#fff" font-family="${SERIF}">${escx(b.big)}</text>
        <text x="125" y="217" text-anchor="middle" font-size="${b.bigsub.length > 8 ? 8.5 : 9.5}" letter-spacing="${b.bigsub.length > 7 ? 1.3 : 2.5}" fill="${gold}" font-family="${SERIF}">${escx(b.bigsub)}</text>`;
    } else {
      center = `<g fill="${gold}" transform="translate(89 140) scale(3)"><path d="${icon}" fill-rule="evenodd"/></g>`;
    }
    const below = b.big ? b.line : b.bigsub;
    const below2 = b.big ? "" : b.line;
    // one line if it fits, else two (smaller), else two with the end cut off with "…"
    const L1 = below ? fitLines(below, 194, below2 ? 12 : 13, 8.5, { weight: 400, spacing: 1.5 }) : { px: 0, lines: [] };
    const lh1 = L1.px * 1.2;
    const y1 = (below2 ? 280 : 284) - (L1.lines.length - 1) * lh1 * 0.35;
    const yDeco = Math.max(292, y1 + (L1.lines.length - 1) * lh1 + 8);
    const L2 = below2 ? fitLines(below2, 194, 10, 7.5, { weight: 400, spacing: 1 }) : { px: 0, lines: [] };
    const lh2 = L2.px * 1.2;
    const y2 = yDeco + 26 - (L2.lines.length - 1) * lh2 * 0.5;
    const belowSvg = L1.lines.map((t, i) => `<text x="125" y="${y1 + i * lh1}" text-anchor="middle" font-size="${L1.px}" letter-spacing="1.5" fill="#fff" font-family="${SERIF}">${escx(t)}</text>`).join("")
      + L2.lines.map((t, i) => `<text x="125" y="${y2 + i * lh2}" text-anchor="middle" font-size="${L2.px}" fill="${gold}" font-family="${SERIF}" letter-spacing="1">${escx(t)}</text>`).join("");
    const svg = `<svg viewBox="0 0 250 350" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <radialGradient id="${id}" cx="50%" cy="48%" r="70%"><stop offset="0" stop-color="${lt}"/><stop offset="1" stop-color="${dk}"/></radialGradient>
        <pattern id="${id}p" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <path d="M0 7 H14" stroke="#000" stroke-opacity=".10" stroke-width="1"/></pattern>
      </defs>
      <rect width="250" height="350" rx="${GAP > 0 ? 12 : 0}" fill="url(#${id})"/>
      <rect width="250" height="350" rx="${GAP > 0 ? 12 : 0}" fill="url(#${id}p)"/>
      <g fill="none" stroke="${gold}">
        <rect x="9" y="9" width="232" height="332" rx="9" stroke-width="2.2"/>
        <rect x="15" y="15" width="220" height="320" rx="6" stroke-width=".7" opacity=".7"/>
        ${corner(15, 15, 1, 1)}${corner(235, 15, -1, 1)}${corner(15, 335, 1, -1)}${corner(235, 335, -1, -1)}
        <path d="M70 66 H180 M95 72 H155" stroke-width=".8" opacity=".8"/>
        <path d="M70 ${yDeco} H180 M95 ${yDeco + 6} H155" stroke-width=".8" opacity=".8"/>
      </g>
      <text x="125" y="56" text-anchor="middle" font-size="${Math.min(15, 190 / Math.max(1, (b.label || "").length) / 0.9)}" letter-spacing="${(b.label || "").length > 12 ? 1.5 : 4}" fill="${gold}" font-family="${SERIF}" font-variant="small-caps">${escx((b.label || "").toUpperCase())}</text>
      <circle cx="125" cy="178" r="72" fill="${dk}" fill-opacity=".55" stroke="${gold}" stroke-width="2.5"/>
      <circle cx="125" cy="178" r="57" fill="none" stroke="${gold}" stroke-width=".8"/>

    const inner = div("inner");
    inner.style.height = h + "in";
    const isBack = /back/i.test(label);
    const tf = [];
    if (isBack && (BACK_OFFSET[0] || BACK_OFFSET[1])) tf.push(`translate(${BACK_OFFSET[0]}mm, ${BACK_OFFSET[1]}mm)`);
    if (flip) tf.push("rotate(180deg)");
    if (tf.length) inner.style.transform = tf.join(" ");
    if (!cls && /front/.test(label)) inner.dataset.cut = "1";
    s.append(inner);
    const l = div("label"); l.textContent = `Sheet ${++sheetNo} — ${label}`; s.append(l);
    sheetsEl.append(s);
    return inner;
  }
  function grid(cols, rows, cw, ch) {
    const x0 = (PAPER.w - (cols * cw + (cols - 1) * GAP)) / 2, y0 = (PAPER.h - (rows * ch + (rows - 1) * GAP)) / 2;
    return (c, r) => ({ left: x0 + c * (cw + GAP), top: y0 + r * (ch + GAP) });
  }
  function place(inner, el, pos, cw, ch, uid) {
    const cell = div("cell");
    if (uid != null) cell.dataset.uid = uid;
    Object.assign(cell.style, { left: pos.left + "in", top: pos.top + "in", width: cw + "in", height: ch + "in" });
    cell.append(el); inner.append(cell);
    (inner._rects = inner._rects || []).push({ l: pos.left, t: pos.top, r: pos.left + cw, b: pos.top + ch });
  }
  const shortFlip = cfg.duplex === "short";
  const wrap = (a, b, cls) => { const w = div("fold " + cls); w.style.left = (GAP / 2) + "in"; a.classList.add("fl"); b.classList.add("fr"); w.append(a, b); return w; };
  const holder = (p, cls) => { const h = div("idxcard " + cls); h.append(p); return h; };
  const only = cfg.only || "";
  const section = cfg.section || "main";   // main | s35 | s58
  const stock = !!cfg.stock;               // index cards printed on card stock in their own files
  const doFront = only !== "backs", doBack = only !== "fronts";
  const backLabel = only ? "backs" : "backs (print on the reverse)";

  // playing cards: one 3x3 grid; fold cards take two side-by-side cells
  if (section === "main") {
    const cols = 3, rows = 3, cw = 2.5, ch = 3.5, at = grid(cols, rows, cw, ch);
    const queue = items.slice();
    while (queue.length) {
      const placed = [];
      for (let r = 0; r < rows && queue.length; r++) {
        let col = 0;
        while (col < cols) {
          const k = queue.findIndex(it => it.w <= cols - col);
          if (k < 0) break;
          const it = queue.splice(k, 1)[0];
          placed.push({ it, col, row: r });
          col += it.w;
        }
      }
      const span = w => w * cw + (w - 1) * GAP;
      if (doFront) {
        const f = newSheet("fronts", false);
        for (const { it, col, row } of placed)
          place(f, it.w === 1 ? it.front : wrap(it.back, it.front, "outside"), at(col, row), span(it.w), ch, it.uid);
      }
      if (doBack) {
        const b = newSheet(backLabel, shortFlip);
        for (const { it, col, row } of placed)
          place(b, it.w === 1 ? it.back : wrap(it.inL, it.inR, "inside"), at(cols - col - it.w, row), span(it.w), ch, it.uid);
      }
    }
  }
  // index cards
  for (const size of ["3x5", "5x8"]) {
    const list = idx[size]; if (!list.length) continue;
    const W = size === "3x5" ? 5 : 8, H = size === "3x5" ? 3 : 5, key = "s" + size.replace("x", "");
    if (stock) {
      if (section !== key) continue;
      for (const c of list) {   // one card per page, page = the card
        if (doFront) { const f = newSheet(size + " index card — front", false, W, H, key); place(f, holder(c.front, "up"), { left: 0, top: 0 }, W, H - 0.02, c.uid); }
        if (doBack) { const b = newSheet(size + " index card — " + backLabel, shortFlip, W, H, key); place(b, holder(c.back, "up"), { left: 0, top: 0 }, W, H - 0.02, c.uid); }
      }
      continue;
    }
    if (section !== "main") continue;
    // on regular paper: 3x5 rotated 2x2 per sheet, 5x8 upright 1x2 per sheet
    const rot = size === "3x5";
    const cols = rot ? 2 : 1, rows = 2, cw = rot ? H : W, ch = rot ? W : H, at = grid(cols, rows, cw, ch), per = cols * rows;
    for (let i = 0; i < list.length; i += per) {
      const chunk = list.slice(i, i + per);
      if (doFront) { const f = newSheet(size + " index cards — fronts", false); chunk.forEach((c, j) => place(f, holder(c.front, rot ? "cw" : "up"), at(j % cols, Math.floor(j / cols)), cw, ch, c.uid)); }
      if (doBack) { const b = newSheet(size + " index cards — " + backLabel, shortFlip); chunk.forEach((c, j) => place(b, holder(c.back, rot ? "ccw" : "up"), at(cols - 1 - (j % cols), Math.floor(j / cols)), cw, ch, c.uid)); }
    }
  }
  // cut lines on the front sheets, running out to the paper edge (never across a card's face)
  function cutLines(inner) {
    const R = inner._rects || [], eps = 1e-4;
    const line = (x, y, w, h) => { const d = div("cut"); Object.assign(d.style, { left: x + "in", top: y + "in", width: w + "in", height: h + "in" }); inner.append(d); };
    const sub = (a, b, blocks) => {   // segment [a,b] minus blocked ranges
      let segs = [[a, b]];
      for (const [x, y] of blocks) segs = segs.flatMap(([s, e]) => (y <= s || x >= e) ? [[s, e]] : [[s, x], [y, e]].filter(([u, v]) => v - u > eps));
      return segs;
    };
    const xs = [...new Set(R.flatMap(r => [r.l, r.r]).map(v => +v.toFixed(4)))];
    const ys = [...new Set(R.flatMap(r => [r.t, r.b]).map(v => +v.toFixed(4)))];
    const T = 0.006; // ~0.45pt
    for (const x of xs) for (const [a, b] of sub(0, PAPER.h, R.filter(r => r.l + eps < x && x < r.r - eps).map(r => [r.t, r.b]))) line(x - T / 2, a, T, b - a);
    for (const y of ys) for (const [a, b] of sub(0, PAPER.w, R.filter(r => r.t + eps < y && y < r.b - eps).map(r => [r.l, r.r]))) line(a, y - T / 2, b - a, T);
  }
  document.querySelectorAll(".sheet").forEach(sh => { const inner = sh.querySelector(".inner"); if (inner.dataset.cut) cutLines(inner); });

  if (!sheetNo) sheetsEl.innerHTML = '<p style="color:#fff;font:16px system-ui;text-align:center;margin:40px">No cards in this file.</p>';
  const n = DATA.cards.reduce((s, c) => s + (c.copies || 1), 0);
  let sum = `${n} card${n === 1 ? "" : "s"}: ${counts.single} single · ${counts.double} two-sided · ${counts.fold} foldable · ${counts["3x5"]} on 3×5 · ${counts["5x8"]} on 5×8 — ${sheetNo} page${sheetNo === 1 ? "" : "s"} in this file`;
  if (skipped.length) sum += ` <span class="warn">· skipped (too long even for a 5×8 card): ${skipped.map(escx).join(", ")}</span>`;
  if (clipped) sum += ` <span class="warn">· ${clipped} card(s) have a table too big for one panel (marked ✂)</span>`;
  document.getElementById("summary").innerHTML = sum;
  document.title = `Card Forge (${n})`;
  if (only) document.getElementById("onlynote").textContent = only === "fronts" ? " This file has the FRONTS only." : " This file has the BACKS only: put the printed fronts back in the tray and print this on the other side.";
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
